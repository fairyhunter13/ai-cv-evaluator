version: "2"
linters:
  enable:
    - gocyclo
    - gosec
    - misspell
    - revive
  settings:
    gocyclo:
      min-complexity: 30
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocyclo
        path: _test\.go
      # G124 targets Set-Cookie; a request-side AddCookie cannot carry these attributes.
      - linters:
          - gosec
        path: _test\.go
        text: 'G124:'
      - linters:
          - errcheck
          - gosec
        path: vendor/|mock_
      - path: internal/adapter/textextractor/tika/tika\.go
        text: 'G304:'
      - linters:
          - gocyclo
        path: internal/adapter/ai/real/client\.go
      - linters:
          - gocyclo
        path: internal/adapter/queue/redpanda/evaluation_handler\.go
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        path: cmd/worker/main\.go
        text: 'G114:'
      - linters:
          - gosec
        path: internal/adapter/httpserver/middleware\.go
        text: 'G404:'
      - linters:
          - staticcheck
        text: 'QF1003:'
    paths:
      - internal/adapter/repo/postgres/mocks
      - internal/domain/mocks
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
